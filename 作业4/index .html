<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }
        .cube{
            width: 170px;
            height: 170px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .3s ease, box-shadow .3s ease;
        }
        .c1{
            border-radius: 50%;
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            box-shadow: 0 10px 24px rgba(255, 94, 98, .35);
        }
        .c2{
            border-radius: 0;
            background: linear-gradient(135deg,#11998e,#38ef7d);
            box-shadow: 0 10px 24px rgba(17, 153, 142, .35);
        }
        .c3{
            border-radius: 28px;
            background: linear-gradient(135deg,#8e2de2,#ff6a88);
            box-shadow: 0 10px 24px rgba(142, 45, 226, .35);
        }
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg,#fceabb,#f8b500);
            box-shadow: 0 10px 24px rgba(248, 181, 0, .35);
        }
        .c5{
            border-radius: 0;
            background: linear-gradient(135deg,#00c6ff,#0072ff);
            box-shadow: 0 10px 24px rgba(0, 114, 255, .35);
        }
        .c6{
            border-radius: 28px;
            background: linear-gradient(135deg,#fc466b,#3f5efb);
            box-shadow: 0 10px 24px rgba(252, 70, 107, .35);
        }
        .cube::after{
            color: #fff;
            font-size: 48px;
            font-weight: 700;
            opacity: 0;
            transform: scale(.7);
            transition: opacity .25s ease, transform .25s ease;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .25);
        }
        .cube:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(255, 255, 255, .35);
        }
        .cube:hover::after{
            content: "hover";
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
